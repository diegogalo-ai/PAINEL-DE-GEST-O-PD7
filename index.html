<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2342">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Acompanhamento de Manutenção · PD7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f5fb;--card:#fff;--tx:#0f1b33;--mut:#5b6b85;--navy:#0a2342;--navy2:#14437f;--blue:#1d6fd8;--line:#e2e9f3;--ok:#14855c;--warn:#b7791f;--bad:#c0392b;--hl:#fff1c2;--sh:0 1px 2px rgba(15,27,51,.06),0 6px 18px rgba(15,27,51,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111f;--card:#121b2e;--tx:#e8eef8;--mut:#93a4bf;--navy:#08162b;--navy2:#0f2d57;--blue:#5aa2ff;--line:#22304a;--ok:#3ecf9a;--warn:#e6b450;--bad:#ff7b6b;--hl:#4a3f12;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a111f;--card:#121b2e;--tx:#e8eef8;--mut:#93a4bf;--navy:#08162b;--navy2:#0f2d57;--blue:#5aa2ff;--line:#22304a;--ok:#3ecf9a;--warn:#e6b450;--bad:#ff7b6b;--hl:#4a3f12;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}header small{opacity:.78;display:block;margin-top:2px}
.logo{display:inline-block;background:#fff;color:var(--navy);font-weight:800;border-radius:8px;padding:2px 9px;margin-right:10px;font-size:15px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 24px 0;max-width:1240px;margin:0 auto}
nav button{border:0;background:transparent;color:var(--mut);padding:9px 16px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600}
nav button:hover{background:var(--card);color:var(--tx)}
nav button.on{background:var(--blue);color:#fff;box-shadow:var(--sh)}
.btn{border:0;background:var(--blue);color:#fff;padding:8px 15px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.btn:hover{filter:brightness(1.08)}.btn.g{background:#ffffff1f;color:#fff;border:1px solid #ffffff44}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}
main{padding:16px 24px 40px;max-width:1240px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
select,input[type=date],.fl input{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.c b{display:block;font-size:28px;line-height:1.1;font-weight:800}.c span{color:var(--mut);font-size:12px;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;min-width:0;box-shadow:var(--sh)}
.p h2{font-size:13px;margin:0 0 12px;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.stk{display:flex;height:28px;border-radius:99px;overflow:hidden;background:var(--line)}.stk i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--mut)}.leg u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;text-decoration:none}
.row{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;margin:5px 0;font-size:12px}.row div{background:var(--line);border-radius:99px;height:10px}.row div i{display:block;height:100%;background:var(--blue);border-radius:99px}
.sc{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--card)}
tr:hover td{background:color-mix(in srgb,var(--blue) 5%,transparent)}
.t{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;color:#fff}
.hl{background:var(--hl)}
.empty{color:var(--mut);padding:26px;text-align:center}
.wk{display:grid;grid-template-columns:repeat(7,minmax(135px,1fr));gap:8px;overflow-x:auto}
.wk>div{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;background:var(--card)}
.wk>div.hl{border:2px solid var(--warn);background:var(--hl)}
.wk h4{margin:0 0 6px;font-size:12px;display:flex;justify-content:space-between;gap:4px}.wk em{display:block;color:var(--mut);font-style:normal;font-size:11px;font-weight:700;margin-top:8px;text-transform:uppercase;letter-spacing:.4px}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.msg{display:none;margin:12px auto 0;max-width:1192px;padding:11px 15px;border-radius:12px;white-space:pre-line;font-size:13px}.msg.ok{background:var(--hl);border:1px solid var(--warn)}.msg.bad{background:#c0392b22;border:1px solid var(--bad)}
.wkb{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:14px 20px;margin-bottom:10px;box-shadow:var(--sh)}
.wn{font-size:26px;margin-right:12px;font-weight:800}.hj{text-decoration:none;background:var(--warn);color:#000;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.today{background:var(--hl);border:1px solid var(--warn);border-radius:12px;padding:8px 14px;margin-bottom:18px;font-weight:600}
.blk{margin-bottom:28px}.bh{display:flex;align-items:center;gap:10px;background:var(--blue);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;margin-bottom:12px;box-shadow:var(--sh)}
.bh span{background:#fff;color:var(--blue);width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px}.bh small{font-weight:400;opacity:.88}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.pv{white-space:pre-line;background:var(--hl);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:13px}
a.chip{display:inline-block;background:var(--line);color:var(--tx);border-radius:99px;padding:1px 9px;margin:1px 2px;cursor:pointer;font-size:11.5px;font-weight:600}a.chip:hover{background:var(--blue);color:#fff}a.chip.add{background:var(--blue);color:#fff}
sup{font-size:9px;color:var(--mut);font-weight:800}
.seg{display:inline-flex;background:var(--line);border-radius:99px;padding:3px}.seg button{border:0;background:transparent;color:var(--mut);padding:5px 14px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600}.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
footer{max-width:1192px;margin:0 auto;padding:0 24px 30px;color:var(--mut);font-size:12px}
@media (max-width:640px){main,nav{padding-left:12px;padding-right:12px}header{padding:14px 12px}.wn{font-size:21px}}

@media (max-width:640px){.wk{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.c b{font-size:23px}.wkb{padding:12px 14px}.p{padding:14px}.row{grid-template-columns:100px 1fr 30px}table{font-size:12px}th,td{padding:7px 6px}}

</style>
</head>
